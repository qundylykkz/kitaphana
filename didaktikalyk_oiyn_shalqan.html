<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шалқан ертегісі - Балабақша ойыны</title>
    <!-- Montserrat шрифті -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js дыбыстар үшін -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Confetti мерекелік әсері -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        montserrat: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        'sun-yellow': '#FDE047',
                        'grass-green': '#4ADE80',
                        'sky-blue': '#38BDF8',
                        'berry-red': '#FB7185',
                        'earth-brown': '#78350F',
                    },
                    animation: {
                        'bounce-slow': 'bounce 2s infinite',
                        'wiggle': 'wiggle 0.5s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 2s infinite',
                    },
                    keyframes: {
                        wiggle: {
                            '0%, 100%': { transform: 'rotate(-5deg)' },
                            '50%': { transform: 'rotate(5deg)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { filter: 'drop-shadow(0 0 15px rgba(250, 204, 21, 0.8))' },
                            '50%': { filter: 'drop-shadow(0 0 30px rgba(234, 88, 12, 1))' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            touch-action: manipulation;
        }
        .btn-bounce:active {
            transform: scale(0.92);
        }
        .game-card {
            box-shadow: 0 10px 0 #0f766e, 0 15px 25px rgba(0,0,0,0.15);
        }
        .game-card:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #0f766e, 0 8px 12px rgba(0,0,0,0.15);
        }
        /* Шалқанның тербелу анимациясы */
        .pulling {
            animation: pullAnim 0.6s infinite alternate;
        }
        @keyframes pullAnim {
            0% { transform: rotate(-4deg) translateY(0); }
            100% { transform: rotate(5deg) translateY(-8px); }
        }
        /* Сұйық анимация */
        .pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-gradient-to-b from-sky-300 via-sky-100 to-green-200 min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- ЖОҒАРҒЫ ПАНЕЛЬ: ДЫБЫС ЖӘНЕ ҮЙГЕ ОРАЛУ -->
    <header class="p-3 sm:p-5 flex justify-between items-center max-w-5xl mx-auto w-full z-20">
        <button id="homeBtn" onclick="goHome()" class="hidden bg-amber-400 hover:bg-amber-300 border-4 border-white text-3xl p-3 rounded-full shadow-lg btn-bounce flex items-center justify-center transition">
            🏡
        </button>
        <div class="flex items-center space-x-2 bg-white/80 backdrop-blur px-4 py-2 rounded-full border-2 border-amber-300 shadow">
            <span class="text-3xl">🌱</span>
            <span class="font-extrabold text-xl sm:text-2xl text-amber-700 tracking-wider">ШАЛҚАН</span>
        </div>
        <button id="soundToggle" onclick="toggleAudio()" class="bg-white hover:bg-yellow-50 border-4 border-amber-300 text-3xl p-3 rounded-full shadow-lg btn-bounce flex items-center justify-center">
            🔊
        </button>
    </header>

    <!-- НЕГІЗГІ ОЙЫН АЙМАҒЫ -->
    <main class="flex-grow flex items-center justify-center p-3 z-10 w-full max-w-5xl mx-auto">
        
        <!-- 1-ЭКРАН: БАСТЫ МӘЗІР (ВИЗУАЛДЫ КАРТАЛАР) -->
        <div id="mainMenu" class="w-full flex flex-col items-center">
            <!-- Жоғарғы мультфильм шалқаны -->
            <div class="relative mb-6 text-center">
                <div class="text-8xl sm:text-9xl animate-bounce-slow filter drop-shadow-xl inline-block cursor-pointer" onclick="playTurnipPop()">
                    🥔
                </div>
                <div class="absolute -top-3 -right-3 text-4xl animate-wiggle">✨</div>
                <div class="mt-2 bg-amber-400 text-amber-950 font-black text-2xl sm:text-3xl px-6 py-2 rounded-full shadow-md border-4 border-white inline-block">
                    Ертегіге қош келдің!
                </div>
            </div>

            <!-- Ойындар батырмалары (Минимум мәтін, үлкен иконалар) -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 sm:gap-6 w-full max-w-4xl px-2">
                <!-- 1-Ойын: Ретімен тарту -->
                <button onclick="startGame(1)" class="game-card bg-emerald-400 border-4 border-white rounded-3xl p-4 flex flex-col items-center justify-center aspect-square transition transform hover:scale-105">
                    <span class="text-5xl sm:text-6xl mb-2">🤝</span>
                    <span class="font-black text-white text-lg sm:text-xl text-center leading-tight drop-shadow">РЕТІМЕН ТАРТУ</span>
                    <span class="text-3xl mt-1">1️⃣ 2️⃣ 3️⃣</span>
                </button>

                <!-- 2-Ойын: Көлеңкесін тап -->
                <button onclick="startGame(2)" class="game-card bg-indigo-400 border-4 border-white rounded-3xl p-4 flex flex-col items-center justify-center aspect-square transition transform hover:scale-105">
                    <span class="text-5xl sm:text-6xl mb-2">👤</span>
                    <span class="font-black text-white text-lg sm:text-xl text-center leading-tight drop-shadow">КӨЛЕҢКЕСІН ТАП</span>
                    <span class="text-3xl mt-1">🔍 👀</span>
                </button>

                <!-- 3-Ойын: Үлкен бе, кіші ме? -->
                <button onclick="startGame(3)" class="game-card bg-amber-500 border-4 border-white rounded-3xl p-4 flex flex-col items-center justify-center aspect-square transition transform hover:scale-105">
                    <div class="flex items-end justify-center mb-2 space-x-1">
                        <span class="text-5xl">👴</span>
                        <span class="text-2xl">🐭</span>
                    </div>
                    <span class="font-black text-white text-lg sm:text-xl text-center leading-tight drop-shadow">ҮЛКЕН - КІШІ</span>
                    <span class="text-3xl mt-1">📏 ⭐</span>
                </button>

                <!-- 4-Ойын: Шалқанды боя -->
                <button onclick="startGame(4)" class="game-card bg-rose-400 border-4 border-white rounded-3xl p-4 flex flex-col items-center justify-center aspect-square transition transform hover:scale-105">
                    <span class="text-5xl sm:text-6xl mb-2">🎨</span>
                    <span class="font-black text-white text-lg sm:text-xl text-center leading-tight drop-shadow">СИҚЫРЛЫ БОЯУ</span>
                    <span class="text-3xl mt-1">🖌️ ✨</span>
                </button>
            </div>
        </div>

        <!-- 2-ЭКРАН: ОЙЫН 1 - РЕТІМЕН ТАРТУ (ЕРТЕГІ КЕЙІПКЕРЛЕРІНІҢ ТІЗБЕГІ) -->
        <div id="game1" class="hidden w-full flex flex-col items-center">
            <div class="bg-white/90 backdrop-blur px-6 py-2 rounded-full border-4 border-emerald-400 shadow-md mb-4 text-center">
                <p class="font-black text-emerald-800 text-lg sm:text-xl">Келесі кім келеді? Бас! 👇</p>
            </div>

            <!-- Сахна (Шалқан мен тартушы кейіпкерлер тізбегі) -->
            <div class="relative w-full h-56 sm:h-72 bg-gradient-to-b from-sky-200 to-green-100 rounded-3xl border-4 border-white shadow-xl overflow-hidden flex items-end justify-center px-4 pb-6 mb-6">
                <!-- Жер қабаты -->
                <div class="absolute bottom-0 w-full h-12 bg-amber-800 border-t-8 border-green-500"></div>

                <!-- Сахнадағы кейіпкерлер контейнері -->
                <div id="charactersLine" class="relative z-10 flex items-end space-x-1 sm:space-x-3 transition-all duration-500">
                    <!-- Шалқан (әдемі үлкен SVG) -->
                    <div id="giantTurnip" class="flex flex-col items-center transition transform cursor-pointer filter drop-shadow-md" onclick="nudgeTurnip()">
                        <!-- Жапырақтары -->
                        <div class="text-5xl sm:text-6xl -mb-4 z-10">🌿</div>
                        <!-- Шалқанның өзі -->
                        <div class="w-24 h-24 sm:w-32 sm:h-32 bg-amber-400 rounded-full border-4 border-amber-600 flex items-center justify-center shadow-inner relative overflow-hidden">
                            <div class="absolute top-2 w-16 h-8 bg-amber-200 rounded-full opacity-60"></div>
                            <!-- Көздері мен күлкісі -->
                            <div class="flex flex-col items-center">
                                <div class="flex space-x-3 mb-1">
                                    <div class="w-3 h-3 bg-black rounded-full animate-ping"></div>
                                    <div class="w-3 h-3 bg-black rounded-full animate-ping"></div>
                                </div>
                                <div class="w-8 h-4 border-b-4 border-amber-900 rounded-full"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Осы жерге шақырылған кейіпкерлер қосылады -->
                    <div id="pulledQueue" class="flex items-end space-x-1 sm:space-x-2"></div>
                </div>
            </div>

            <!-- Таңдау нұсқалары (Үлкен батырмалар) -->
            <div id="characterChoices" class="grid grid-cols-3 sm:grid-cols-6 gap-3 w-full max-w-3xl"></div>
        </div>

        <!-- 3-ЭКРАН: ОЙЫН 2 - КӨЛЕҢКЕСІН ТАП (КӨРНЕКІ СӘЙКЕСТЕНДІРУ) -->
        <div id="game2" class="hidden w-full flex flex-col items-center">
            <div class="bg-white/90 backdrop-blur px-6 py-2 rounded-full border-4 border-indigo-400 shadow-md mb-6 text-center">
                <p class="font-black text-indigo-900 text-lg sm:text-xl">Мынау кімнің көлеңкесі? 👤</p>
            </div>

            <!-- Сұрақ көлеңкесі -->
            <div class="bg-white p-6 rounded-3xl border-4 border-dashed border-indigo-400 shadow-xl mb-6 flex items-center justify-center w-48 h-48 sm:w-56 sm:h-56">
                <span id="shadowTarget" class="text-8xl sm:text-9xl filter brightness-0 opacity-85 transition transform hover:scale-105 duration-300">
                    👴
                </span>
            </div>

            <!-- Жауап нұсқалары (3 үлкен сурет) -->
            <div id="shadowOptions" class="grid grid-cols-3 gap-4 w-full max-w-md"></div>
        </div>

        <!-- 4-ЭКРАН: ОЙЫН 3 - ҮЛКЕН-КІШІ (САЛЫСТЫРУ) -->
        <div id="game3" class="hidden w-full flex flex-col items-center">
            <div class="bg-white/90 backdrop-blur px-6 py-2 rounded-full border-4 border-amber-500 shadow-md mb-6 text-center">
                <p id="sizeQuestionText" class="font-black text-amber-900 text-lg sm:text-xl">Қайсысы ҮЛКЕН? 🐘</p>
            </div>

            <div class="flex items-center justify-center space-x-4 sm:space-x-8 w-full max-w-lg my-6">
                <!-- Сол жақтағы карта -->
                <button id="sizeBtn1" onclick="checkSizeAnswer(0)" class="game-card bg-amber-100 hover:bg-amber-200 border-4 border-amber-500 rounded-3xl p-6 flex flex-col items-center justify-center flex-1 aspect-square transition transform hover:scale-105">
                    <span id="sizeIcon1" class="text-7xl sm:text-8xl">👴</span>
                </button>

                <!-- Ортадағы белгі -->
                <span class="text-4xl font-black text-amber-800">VS</span>

                <!-- Оң жақтағы карта -->
                <button id="sizeBtn2" onclick="checkSizeAnswer(1)" class="game-card bg-amber-100 hover:bg-amber-200 border-4 border-amber-500 rounded-3xl p-6 flex flex-col items-center justify-center flex-1 aspect-square transition transform hover:scale-105">
                    <span id="sizeIcon2" class="text-7xl sm:text-8xl">🐭</span>
                </button>
            </div>
        </div>

        <!-- 5-ЭКРАН: ОЙЫН 4 - ШАЛҚАНДЫ БОЯУ (ИНТЕРАКТИВТІ СУРЕТ) -->
        <div id="game4" class="hidden w-full flex flex-col items-center">
            <div class="bg-white/90 backdrop-blur px-6 py-2 rounded-full border-4 border-rose-400 shadow-md mb-4 text-center">
                <p class="font-black text-rose-900 text-lg sm:text-xl">Түсті таңдап, шалқанды боя! 🎨</p>
            </div>

            <!-- Түс таңдау палитрасы -->
            <div class="flex space-x-3 mb-6 bg-white p-3 rounded-full border-2 border-rose-200 shadow-md">
                <button onclick="selectColor('#FBBF24')" class="w-12 h-12 rounded-full bg-amber-400 border-4 border-white shadow-md transform hover:scale-110 active:scale-95 transition"></button>
                <button onclick="selectColor('#22C55E')" class="w-12 h-12 rounded-full bg-green-500 border-4 border-white shadow-md transform hover:scale-110 active:scale-95 transition"></button>
                <button onclick="selectColor('#FB7185')" class="w-12 h-12 rounded-full bg-rose-400 border-4 border-white shadow-md transform hover:scale-110 active:scale-95 transition"></button>
                <button onclick="selectColor('#A855F7')" class="w-12 h-12 rounded-full bg-purple-500 border-4 border-white shadow-md transform hover:scale-110 active:scale-95 transition"></button>
                <button onclick="selectColor('#38BDF8')" class="w-12 h-12 rounded-full bg-sky-400 border-4 border-white shadow-md transform hover:scale-110 active:scale-95 transition"></button>
                <button onclick="selectColor('#FFFFFF')" class="w-12 h-12 rounded-full bg-white border-4 border-gray-300 shadow-md transform hover:scale-110 active:scale-95 transition flex items-center justify-center text-sm">🧽</button>
            </div>

            <!-- Боялатын SVG Шалқан -->
            <div class="bg-white rounded-3xl p-6 border-4 border-rose-300 shadow-xl w-72 h-72 sm:w-80 sm:h-80 flex items-center justify-center">
                <svg viewBox="0 0 200 200" class="w-full h-full cursor-pointer">
                    <!-- Сол жапырақ -->
                    <path id="leaf1" onclick="paintElement(this)" d="M 85 80 C 40 30, 20 60, 50 85 C 65 95, 80 85, 85 80 Z" fill="#E2E8F0" stroke="#1E293B" stroke-width="6" stroke-linejoin="round" />
                    <!-- Оң жапырақ -->
                    <path id="leaf2" onclick="paintElement(this)" d="M 115 80 C 160 30, 180 60, 150 85 C 135 95, 120 85, 115 80 Z" fill="#E2E8F0" stroke="#1E293B" stroke-width="6" stroke-linejoin="round" />
                    <!-- Ортаңғы жапырақ -->
                    <path id="leaf3" onclick="paintElement(this)" d="M 100 80 C 80 15, 120 15, 100 80 Z" fill="#E2E8F0" stroke="#1E293B" stroke-width="6" stroke-linejoin="round" />
                    
                    <!-- Шалқанның денесі -->
                    <ellipse id="turnipBody" onclick="paintElement(this)" cx="100" cy="130" rx="60" ry="50" fill="#F1F5F9" stroke="#1E293B" stroke-width="6" />
                    <!-- Төменгі ұшы -->
                    <path id="turnipRoot" onclick="paintElement(this)" d="M 90 175 Q 100 195 105 190 Q 110 175 100 175 Z" fill="#F1F5F9" stroke="#1E293B" stroke-width="5" />

                    <!-- Шалқанның көздері (сүйкімді бет-әлпет) -->
                    <circle cx="85" cy="125" r="6" fill="#1E293B" />
                    <circle cx="115" cy="125" r="6" fill="#1E293B" />
                    <ellipse cx="78" cy="135" rx="5" ry="3" fill="#FDA4AF" opacity="0.8" />
                    <ellipse cx="122" cy="135" rx="5" ry="3" fill="#FDA4AF" opacity="0.8" />
                    <path d="M 92 135 Q 100 145 108 135" stroke="#1E293B" stroke-width="4" fill="none" stroke-linecap="round" />
                </svg>
            </div>
            
            <button onclick="celebrateArt()" class="mt-4 bg-emerald-500 hover:bg-emerald-600 border-4 border-white text-white font-black text-xl px-8 py-3 rounded-full shadow-lg btn-bounce">
                ДАЙЫН! 🎉
            </button>
        </div>

    </main>

    <!-- ТӨМЕНГІ БАСҚАРУ ЖӘНЕ КЕЙІПКЕРЛЕР АНЫҚТАМАЛЫҒЫ -->
    <footer class="p-3 text-center text-emerald-900 font-bold text-sm bg-white/40 backdrop-blur z-10">
        Балаларға арналған қазақша танымдық ойын 🌾
    </footer>

    <!-- ЖЕҢІС / МАРАПАТТАУ МОДАЛЫ -->
    <div id="rewardModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl border-8 border-yellow-400 p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl pop-in">
            <div class="text-7xl mb-4 animate-bounce">🏆</div>
            <h2 class="text-3xl font-black text-amber-600 mb-2">ЖАРАЙСЫҢ!</h2>
            <p class="text-lg font-bold text-gray-700 mb-6">Шалқанды бәріміз бірге жұлып алдық!</p>
            <div class="text-6xl mb-6">🥔✨🎉</div>
            <button onclick="closeModalAndGoHome()" class="w-full bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-500 hover:to-yellow-600 border-4 border-white text-amber-950 font-black text-2xl py-4 rounded-2xl shadow-lg btn-bounce">
                ТАҒЫ ОЙНАУ 🔄
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT ЛОГИКАСЫ -->
    <script>
        // ДЫБЫСТАРДЫ БАПТАУ (Web Audio API / Tone.js)
        let soundEnabled = true;
        let synth, membraneSynth;

        function initAudio() {
            if (!synth) {
                synth = new Tone.PolySynth(Tone.Synth).toDestination();
                synth.set({
                    envelope: { attack: 0.05, decay: 0.2, sustain: 0.2, release: 0.8 },
                    oscillator: { type: "triangle" }
                });
                membraneSynth = new Tone.MembraneSynth().toDestination();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                initAudio();
                if (Tone.context.state !== 'running') {
                    Tone.context.resume();
                }
                const now = Tone.now();
                if (type === 'pop') {
                    synth.triggerAttackRelease("C5", "8n", now);
                } else if (type === 'correct') {
                    synth.triggerAttackRelease(["E5", "G5", "C6"], "8n", now);
                } else if (type === 'pull') {
                    membraneSynth.triggerAttackRelease("G2", "8n", now);
                } else if (type === 'win') {
                    synth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "4n", now);
                } else if (type === 'wrong') {
                    membraneSynth.triggerAttackRelease("C2", "4n", now);
                }
            } catch (e) {
                console.log("Audio waiting for user gesture:", e);
            }
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundToggle');
            btn.innerHTML = soundEnabled ? '🔊' : '🔇';
            btn.classList.toggle('opacity-50', !soundEnabled);
            if (soundEnabled) playSound('pop');
        }

        function playTurnipPop() {
            playSound('pop');
            confetti({ particleCount: 30, spread: 60, origin: { y: 0.4 } });
        }

        // КЕЙІПКЕРЛЕР ТІЗІМІ ЖӘНЕ ОЛАРДЫҢ РЕТІ
        const CHARACTERS = [
            { id: 1, name: "Ата", icon: "👴", scale: "text-6xl sm:text-7xl", sizeScore: 6 },
            { id: 2, name: "Әже", icon: "👵", scale: "text-6xl sm:text-7xl", sizeScore: 5 },
            { id: 3, name: "Немере", icon: "👧", scale: "text-5xl sm:text-6xl", sizeScore: 4 },
            { id: 4, name: "Күшік", icon: "🐶", scale: "text-4xl sm:text-5xl", sizeScore: 3 },
            { id: 5, name: "Мысық", icon: "🐱", scale: "text-3xl sm:text-4xl", sizeScore: 2 },
            { id: 6, name: "Тышқан", icon: "🐭", scale: "text-2xl sm:text-3xl", sizeScore: 1 }
        ];

        let currentGame = 0;
        let game1CurrentStep = 0;

        // БАҒЫТТАУ ЖҮЙЕСІ
        function showScreen(screenId) {
            ['mainMenu', 'game1', 'game2', 'game3', 'game4'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');

            const homeBtn = document.getElementById('homeBtn');
            if (screenId === 'mainMenu') {
                homeBtn.classList.add('hidden');
            } else {
                homeBtn.classList.remove('hidden');
            }
        }

        function goHome() {
            playSound('pop');
            showScreen('mainMenu');
        }

        function startGame(num) {
            playSound('pop');
            currentGame = num;
            showScreen(`game${num}`);

            if (num === 1) setupGame1();
            if (num === 2) setupGame2();
            if (num === 3) setupGame3();
            if (num === 4) setupGame4();
        }

        // ==========================================
        // 1-ОЙЫН: РЕТІМЕН ТАРТУ (ШАЛҚАНДЫ СУЫРУ)
        // ==========================================
        function setupGame1() {
            game1CurrentStep = 0;
            const line = document.getElementById('pulledQueue');
            line.innerHTML = '';
            
            const turnip = document.getElementById('giantTurnip');
            turnip.className = "flex flex-col items-center transition transform cursor-pointer filter drop-shadow-md";

            renderGame1Buttons();
        }

        function renderGame1Buttons() {
            const container = document.getElementById('characterChoices');
            container.innerHTML = '';

            // Балалар үшін ретімен шақыруға арналған батырмалар
            // Араластырылған кейіпкерлер тізімі
            const shuffled = [...CHARACTERS].sort(() => Math.random() - 0.5);

            shuffled.forEach(char => {
                const btn = document.createElement('button');
                btn.className = "game-card bg-amber-100 hover:bg-yellow-200 border-4 border-amber-400 rounded-2xl p-3 flex flex-col items-center justify-center transition transform active:scale-90";
                btn.innerHTML = `
                    <span class="text-4xl sm:text-5xl mb-1">${char.icon}</span>
                    <span class="font-extrabold text-sm text-amber-900">${char.name}</span>
                `;
                btn.onclick = () => selectGame1Character(char, btn);
                container.appendChild(btn);
            });
        }

        function selectGame1Character(char, buttonEl) {
            const expectedChar = CHARACTERS[game1CurrentStep];

            if (char.id === expectedChar.id) {
                // Дұрыс жауап!
                playSound('pull');
                game1CurrentStep++;

                // Сахнаға қосу
                const queue = document.getElementById('pulledQueue');
                const charDiv = document.createElement('div');
                charDiv.className = `${char.scale} pop-in filter drop-shadow flex flex-col items-center`;
                charDiv.innerHTML = `
                    <span>${char.icon}</span>
                    <span class="text-xs font-bold text-emerald-900">${char.name}</span>
                `;
                queue.appendChild(charDiv);

                // Батырманы жасыру немесе өшіру
                buttonEl.classList.add('opacity-30', 'pointer-events-none');

                // Шалқанды тартып тербелту
                const turnip = document.getElementById('giantTurnip');
                turnip.classList.add('pulling');

                if (game1CurrentStep === CHARACTERS.length) {
                    // Бәрі жиналды! Шалқан жұлынды!
                    setTimeout(() => {
                        turnip.classList.remove('pulling');
                        turnip.classList.add('animate-bounce', '-translate-y-6');
                        triggerVictory();
                    }, 600);
                }
            } else {
                // Қате басылды - жұмсақ діріл
                playSound('wrong');
                buttonEl.classList.add('animate-wiggle');
                setTimeout(() => buttonEl.classList.remove('animate-wiggle'), 500);
            }
        }

        function nudgeTurnip() {
            playSound('pop');
            const turnip = document.getElementById('giantTurnip');
            turnip.classList.add('animate-wiggle');
            setTimeout(() => turnip.classList.remove('animate-wiggle'), 400);
        }

        // ==========================================
        // 2-ОЙЫН: КӨЛЕҢКЕСІН ТАП
        // ==========================================
        let game2Target = null;

        function setupGame2() {
            // Кездейсоқ бір кейіпкерді таңдау
            game2Target = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)];
            
            const shadowEl = document.getElementById('shadowTarget');
            shadowEl.textContent = game2Target.icon;

            // Дұрыс және 2 қате нұсқа құру
            const otherChars = CHARACTERS.filter(c => c.id !== game2Target.id);
            const shuffledOthers = otherChars.sort(() => Math.random() - 0.5).slice(0, 2);
            const options = [game2Target, ...shuffledOthers].sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('shadowOptions');
            optionsContainer.innerHTML = '';

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "game-card bg-white hover:bg-indigo-50 border-4 border-indigo-300 rounded-3xl p-4 flex flex-col items-center justify-center aspect-square transition transform active:scale-95";
                btn.innerHTML = `
                    <span class="text-6xl sm:text-7xl mb-2 filter drop-shadow">${opt.icon}</span>
                    <span class="font-black text-indigo-950 text-base sm:text-lg">${opt.name}</span>
                `;
                btn.onclick = () => {
                    if (opt.id === game2Target.id) {
                        playSound('correct');
                        btn.classList.add('bg-green-200', 'border-green-500');
                        confetti({ particleCount: 50, spread: 70, origin: { y: 0.6 } });
                        setTimeout(setupGame2, 1200);
                    } else {
                        playSound('wrong');
                        btn.classList.add('animate-wiggle', 'bg-red-100');
                        setTimeout(() => btn.classList.remove('animate-wiggle', 'bg-red-100'), 400);
                    }
                };
                optionsContainer.appendChild(btn);
            });
        }

        // ==========================================
        // 3-ОЙЫН: ҮЛКЕН БЕ, КІШІ МЕ? (САЛЫСТЫРУ)
        // ==========================================
        let sizeMode = 'BIG'; // 'BIG' немесе 'SMALL'
        let currentPair = [];

        function setupGame3() {
            // Кездейсоқ режим: Үлкенді немесе Кішіні таңдау
            sizeMode = Math.random() > 0.5 ? 'BIG' : 'SMALL';
            const questionText = document.getElementById('sizeQuestionText');
            
            if (sizeMode === 'BIG') {
                questionText.innerHTML = "Қайсысы ҮЛКЕН? 🐘";
                questionText.className = "font-black text-amber-900 text-lg sm:text-xl";
            } else {
                questionText.innerHTML = "Қайсысы КІШІ? 🐜";
                questionText.className = "font-black text-sky-900 text-lg sm:text-xl";
            }

            // Екі түрлі кейіпкер таңдау
            const shuffled = [...CHARACTERS].sort(() => Math.random() - 0.5);
            currentPair = [shuffled[0], shuffled[1]];

            document.getElementById('sizeIcon1').textContent = currentPair[0].icon;
            document.getElementById('sizeIcon2').textContent = currentPair[1].icon;
        }

        function checkSizeAnswer(selectedIndex) {
            const first = currentPair[0];
            const second = currentPair[1];
            
            let isFirstCorrect = false;
            if (sizeMode === 'BIG') {
                isFirstCorrect = first.sizeScore > second.sizeScore;
            } else {
                isFirstCorrect = first.sizeScore < second.sizeScore;
            }

            const chosenIsCorrect = (selectedIndex === 0 && isFirstCorrect) || (selectedIndex === 1 && !isFirstCorrect);

            const clickedBtn = document.getElementById(selectedIndex === 0 ? 'sizeBtn1' : 'sizeBtn2');

            if (chosenIsCorrect) {
                playSound('correct');
                clickedBtn.classList.add('bg-green-300', 'border-green-600');
                confetti({ particleCount: 40, spread: 60, origin: { y: 0.5 } });
                setTimeout(() => {
                    clickedBtn.classList.remove('bg-green-300', 'border-green-600');
                    setupGame3();
                }, 1000);
            } else {
                playSound('wrong');
                clickedBtn.classList.add('animate-wiggle', 'bg-rose-200');
                setTimeout(() => {
                    clickedBtn.classList.remove('animate-wiggle', 'bg-rose-200');
                }, 400);
            }
        }

        // ==========================================
        // 4-ОЙЫН: ШАЛҚАНДЫ БОЯУ
        // ==========================================
        let selectedColor = '#FBBF24'; // Әдепкі сары түс

        function setupGame4() {
            // Түстерді тазарту
            ['leaf1', 'leaf2', 'leaf3'].forEach(id => {
                document.getElementById(id).setAttribute('fill', '#E2E8F0');
            });
            document.getElementById('turnipBody').setAttribute('fill', '#F1F5F9');
            document.getElementById('turnipRoot').setAttribute('fill', '#F1F5F9');
        }

        function selectColor(color) {
            playSound('pop');
            selectedColor = color;
        }

        function paintElement(element) {
            playSound('pop');
            element.setAttribute('fill', selectedColor);
            element.classList.add('pop-in');
            setTimeout(() => element.classList.remove('pop-in'), 400);
        }

        function celebrateArt() {
            playSound('win');
            confetti({ particleCount: 100, spread: 100, origin: { y: 0.5 } });
            setTimeout(() => {
                showScreen('mainMenu');
            }, 1800);
        }

        // ==========================================
        // ЖЕҢІС ПЕН АЯҚТАУ ТЕРЕЗЕСІ
        // ==========================================
        function triggerVictory() {
            playSound('win');
            confetti({
                particleCount: 150,
                spread: 120,
                origin: { y: 0.6 }
            });
            setTimeout(() => {
                document.getElementById('rewardModal').classList.remove('hidden');
            }, 1000);
        }

        function closeModalAndGoHome() {
            playSound('pop');
            document.getElementById('rewardModal').classList.add('hidden');
            showScreen('mainMenu');
        }

        // Бастапқы күйі
        window.onload = function() {
            showScreen('mainMenu');
        };
    </script>
</body>
</html>
